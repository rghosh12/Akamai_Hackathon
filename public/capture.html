<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LabStrata Capture</title><style>body{font:16px/1.45 system-ui,sans-serif;margin:0;background:#f5f7f6;color:#18211d}main{max-width:680px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #dde3e0;border-radius:12px;padding:16px;margin:12px 0}label,button{display:block;margin:10px 0}button,input{font:inherit}button{padding:9px 14px;border-radius:8px;border:1px solid #0f6b5c;background:#0f6b5c;color:#fff}button:disabled{opacity:.6}img{max-width:48%;height:auto;border-radius:8px}.read{display:flex;gap:12px;align-items:start}.lines{flex:1;white-space:pre-wrap}.unreadable{color:#b42318;font-weight:700}textarea{width:100%;min-height:180px;font:14px ui-monospace,monospace}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #3653a6;outline-offset:2px}</style></head>
<body><main><h1>LabStrata Capture</h1><p id="assignment" role="status">Loading assignment…</p><div class="card"><label for="photo">Photograph the handwritten run log</label><input id="photo" type="file" accept="image/*" capture="environment"><button id="read" data-demo="capture-submit" disabled>Upload and read photo</button><p id="message" role="status"></p><div id="output" role="status"></div></div><div class="card"><label for="log">Run log to verify</label><textarea id="log" aria-describedby="message"></textarea><button id="verify" disabled>Verify against assignment SOP</button><pre id="result" aria-live="polite"></pre></div></main><script>
const id=location.pathname.split('/').pop(), $=s=>document.querySelector(s); let assignment,sop='',image='',photoBlob=null,photoUrl='',photoKey=null,vision=null,storageReady=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,body){const r=await fetch('/api'+path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:undefined),j=await r.json();if(!r.ok)throw Error(j.error||r.statusText);return j}
(async()=>{try{const [d,c]=await Promise.all([api('/assignment?id='+encodeURIComponent(id)),api('/config')]);assignment=d.assignment;sop=d.version.steps.map((s,i)=>`${i===0?'PPE: ':'Step '+i+'. '}${s.label}`).join('\n');storageReady=Boolean(c.storage&&c.storage.ready);$('#assignment').textContent=`${assignment.title} · assigned to ${assignment.assignee}`}catch(e){$('#assignment').textContent=e.message}})();
async function resizePhoto(file){const bitmap=window.createImageBitmap?await createImageBitmap(file):await new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=reject;img.src=url});const scale=Math.min(1,1600/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);if(bitmap.close)bitmap.close();const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.8));if(!blob)throw Error('Could not prepare the photo');return blob}
const asDataUrl=blob=>new Promise((resolve,reject)=>{const r=new FileReader;r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob)});
$('#photo').onchange=async()=>{const f=$('#photo').files[0];if(!f)return;try{$('#read').disabled=true;$('#message').textContent='Preparing photo…';photoBlob=await resizePhoto(f);image=await asDataUrl(photoBlob);photoUrl=URL.createObjectURL(photoBlob);$('#read').disabled=false;$('#message').textContent='Ready to upload and read.'}catch(e){$('#message').textContent=e.message}};
$('#read').onclick=async()=>{try{if(!assignment||!photoBlob)throw Error('Choose a photo after the assignment loads.');$('#read').disabled=true;$('#message').textContent=storageReady?'Uploading photo…':'Reading photo…';if(storageReady){const pre=await api('/capture/presign',{assignmentId:assignment.id,contentType:'image/jpeg'});const put=await fetch(pre.url,{method:'PUT',headers:{'Content-Type':pre.contentType},body:photoBlob});if(!put.ok)throw Error(`Upload failed (${put.status})`);await api('/capture/done',{assignmentId:assignment.id,key:pre.key});photoKey=pre.key;$('#message').textContent='Photo uploaded. Reading photo…';vision=await api('/read-photo',{key:photoKey})}else vision=await api('/read-photo',{image});if(vision.error)throw Error(vision.error);const lines=vision.lines||[];$('#log').value=lines.map(x=>x.text||'').filter(Boolean).join('\n');$('#output').innerHTML=`<div class="read"><img src="${esc(photoUrl||image)}" alt="Selected lab log photo"><div class="lines" data-demo="read-lines">${lines.map(x=>`${esc(x.n||'')}. ${x.unreadable?'<span class="unreadable">Unreadable: retake or rewrite</span>':esc(x.text)}`).join('<br>')}</div></div>`;$('#verify').disabled=false;$('#message').textContent=storageReady?'Photo uploaded and read. Review the transcription, then verify.':'Photo read. Review the transcription, then verify.'}catch(e){$('#message').textContent=e.message}finally{$('#read').disabled=false}};
$('#verify').onclick=async()=>{try{$('#verify').disabled=true;$('#result').textContent='Verifying…';const d=await api('/verify',{sop,log:$('#log').value,assignmentId:assignment?.id,photoKey,vision});$('#result').textContent=(d.findings||[]).map(f=>`Line ${f.sop_line}: ${f.status} — ${f.reason}`).join('\n')}catch(e){$('#result').textContent=e.message}finally{$('#verify').disabled=false}};
</script></body></html>

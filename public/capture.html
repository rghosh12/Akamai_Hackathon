<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LabStrata Capture</title><style>body{font:16px/1.45 system-ui,sans-serif;margin:0;background:#f5f7f6;color:#18211d}main{max-width:680px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #dde3e0;border-radius:12px;padding:16px;margin:12px 0}label,button{display:block;margin:10px 0}button,input{font:inherit}button{padding:9px 14px;border-radius:8px;border:1px solid #0f6b5c;background:#0f6b5c;color:#fff}button:disabled{opacity:.6}img{max-width:48%;height:auto;border-radius:8px}.read{display:flex;gap:12px;align-items:start}.lines{flex:1;white-space:pre-wrap}.unreadable{color:#b42318;font-weight:700}textarea{width:100%;min-height:180px;font:14px ui-monospace,monospace}button:focus-visible,input:focus-visible{outline:3px solid #3653a6;outline-offset:2px}</style></head>
<body><main><h1>LabStrata Capture</h1><p id="assignment">Loading assignment…</p><div class="card"><label for="photo">Photograph the handwritten run log</label><input id="photo" type="file" accept="image/*" capture="environment"><button id="read" disabled>Read photo</button><p id="message" role="status"></p><div id="output"></div></div><div class="card"><label for="log">Run log to verify</label><textarea id="log" aria-describedby="message"></textarea><button id="verify" disabled>Verify against assignment SOP</button><pre id="result" aria-live="polite"></pre></div></main><script>
const id=location.pathname.split('/').pop(), $=s=>document.querySelector(s); let assignment, sop='', image='';
async function api(path,body){const r=await fetch('/api'+path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:undefined),j=await r.json();if(!r.ok)throw Error(j.error||r.statusText);return j}
(async()=>{try{const d=await api('/assignment?id='+encodeURIComponent(id));assignment=d.assignment;sop=d.version.steps.map((s,i)=>`${i===0?'PPE: ':'Step '+i+'. '}${s.label}`).join('\n');$('#assignment').textContent=`${assignment.title} · assigned to ${assignment.assignee}`}catch(e){$('#assignment').textContent=e.message}})();
async function resizePhoto(file){
  const bitmap=window.createImageBitmap?await createImageBitmap(file):await new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{URL.revokeObjectURL(url);resolve(img)};img.onerror=reject;img.src=url});
  const scale=Math.min(1,1600/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');
  canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);
  if(bitmap.close)bitmap.close();
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/jpeg',.8));
  if(!blob)throw Error('Could not prepare the photo');
  return new Promise((resolve,reject)=>{const r=new FileReader;r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(blob)});
}
$('#photo').onchange=async()=>{const f=$('#photo').files[0];if(!f)return;try{$('#read').disabled=true;$('#message').textContent='Preparing photo…';image=await resizePhoto(f);$('#read').disabled=false;$('#message').textContent=''}catch(e){$('#message').textContent=e.message}};
$('#read').onclick=async()=>{try{$('#read').disabled=true;$('#message').textContent='Reading photo…';const d=await api('/read-photo',{image});if(d.error)throw Error(d.error);const lines=d.lines||[];$('#log').value=lines.map(x=>x.text).join('\n');$('#output').innerHTML=`<div class="read"><img src="${image}" alt="Selected lab log photo"><div class="lines">${lines.map(x=>`${x.n}. ${x.unreadable?'<span class="unreadable">Unreadable: retake or rewrite</span>':escapeHtml(x.text)}`).join('<br>')}</div></div>`;$('#verify').disabled=false;$('#message').textContent='Review the transcription, then verify.'}catch(e){$('#message').textContent=e.message}finally{$('#read').disabled=false}};
$('#verify').onclick=async()=>{try{$('#verify').disabled=true;$('#result').textContent='Verifying…';const d=await api('/verify',{sop,log:$('#log').value});$('#result').textContent=d.findings.map(f=>`Line ${f.sop_line}: ${f.status} — ${f.reason}`).join('\n')}catch(e){$('#result').textContent=e.message}finally{$('#verify').disabled=false}};
function escapeHtml(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
</script></body></html>
